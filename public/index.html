    <title>WebGL2 Tech Demo</title>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        div#canvas-container {
            display: grid;
            grid: 100vh / minmax(60vw, auto) minmax(min-content, 20rem);
        }

        canvas#wgl2 {
            width: 100%;
            height: 100%;
        }

        fieldset {
            display: flex;
            flex-direction: column;
        }

        fieldset#ui-controls {
            overflow: scroll;
            overflow-x: hidden;
        }

        @media (max-width: 768px) {
            div#canvas-container {
                grid: 60vh 40vh / 100vw;
            }
        }
    </style>

    <script type="module" src="bundle.js" defer></script>

    <script id="2d-default-vert" type="x-vert-shader">
        #version 300 es

        layout (location = 0) in vec2 aPosition;

        uniform mat3 uModelProjection;

        void main() {
            gl_Position = vec4((uModelProjection * vec3(aPosition, 1)).xy, 0, 1);
        }
    </script>
    <script id="2d-default-frag" type="x-frag-shader">
        #version 300 es

        precision mediump float;

        uniform vec3 uColor;

        out vec4 FragColor;

        void main() {
            FragColor = vec4(uColor, 1);
        }
    </script>

    <script id="2d-instanced-vert" type="x-vert-shader">
        #version 300 es

        layout (location = 0) in vec2 aPosition;
        layout (location = 1) in vec3 aColor;
        layout (location = 2) in mat3 aWorldProjection;

        out vec3 uColor;

        void main() {
            gl_Position = vec4((aWorldProjection * vec3(aPosition, 1)).xy, 0, 1);
            uColor = aColor;
        }
    </script>
    <script id="2d-instanced-frag" type="x-frag-shader">
        #version 300 es

        precision mediump float;

        in vec3 uColor;

        out vec4 FragColor;

        void main() {
            FragColor = vec4(uColor, 1);
        }
    </script>

    <script id="3d-default-vert" type="x-vert-shader">
        #version 300 es

        layout (location = 0) in vec4 aPosition;
        layout (location = 1) in vec3 aColor;

        out vec3 uColor;

        uniform mat4 uModelProjection;

        void main() {
            uColor = aColor;
            gl_Position = uModelProjection * aPosition;
        }
    </script>
    <script id="3d-default-frag" type="x-frag-shader">
        #version 300 es

        precision mediump float;

        in vec3 uColor;

        out vec4 FragColor;

        void main() {
            FragColor = vec4(uColor, 1);
        }
    </script>

        <script id="3d-flat-clr-vert" type="x-vert-shader">
        #version 300 es

        layout (location = 0) in vec4 aPosition;

        uniform mat4 uModelProjection;

        void main() {
            gl_Position = uModelProjection * aPosition;
        }
    </script>
    <script id="3d-flat-clr-frag" type="x-frag-shader">
        #version 300 es

        precision mediump float;

        out vec4 FragColor;

        uniform vec3 uColor;

        void main() {
            FragColor = vec4(uColor, 1);
        }
    </script>

    <script id="3d-lighting-vert" type="x-vert-shader">
        #version 300 es

        layout (location = 0) in vec4 aPosition;
        layout (location = 1) in vec3 aColor;
        layout (location = 2) in vec3 aNormal;

        out vec3 Color;
        out vec3 Normal;
        out vec3 FragPos;

        uniform mat4 uWorld;
        uniform mat4 uWorldInverseTranspose;
        uniform mat4 uWorldProjection;

        void main() {
            gl_Position = uWorldProjection * aPosition;
            Color = aColor;
            Normal = mat3(uWorldInverseTranspose) * aNormal;
            FragPos = vec3(uWorld * aPosition);
        }
    </script>
    <script id="3d-lighting-frag" type="x-frag-shader">
        #version 300 es

        precision mediump float;

        in vec3 Color;
        in vec3 Normal;
        in vec3 FragPos;

        out vec4 FragColor;

        uniform vec3 uLightPos;
        uniform vec3 uViewPos;

        void main() {
            vec3 lightColor = vec3(1.0, 1.0, 1.0);

            vec3 vn = normalize(Normal);
            vec3 viewDir = normalize(uViewPos - FragPos);
            vec3 lightDirection = normalize(uLightPos - FragPos);
            vec3 reflectionDir = reflect(-lightDirection, vn);

            float ambient = 0.4;
            vec3 ambientColor = ambient * lightColor;

            float diffuse = max(dot(vn, lightDirection), 0.0);
            vec3 diffuseColor = diffuse * lightColor;

            float specularStrength = 0.5;
            float specular = pow(max(dot(viewDir, reflectionDir), 0.0), 256.0);
            vec3 specularColor = specularStrength * specular * lightColor;

            FragColor = vec4(Color * (ambientColor + diffuseColor + specularColor), 1);
        }
    </script>
